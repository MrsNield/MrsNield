<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mrs. Nield's Math Classes</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-dark: #14264a;
    --light: #DCE6F1;
    --gold: #C9972B;
    --green: #1E6B3C;
    --maroon: #7A1F3D;
    --gray: #666666;
    --bg: #f5f7fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: #222;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 20px 24px 0 24px;
  }
  header h1 {
    margin: 0 0 16px 0;
    font-size: 1.5rem;
  }
  .course-tabs {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .course-tab {
    background: var(--navy-dark);
    color: #cdd8e8;
    border: none;
    padding: 12px 20px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .course-tab.active {
    background: var(--bg);
    color: var(--navy);
  }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px 60px 16px;
  }
  .placeholder-card {
    background: white;
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    color: var(--gray);
    font-size: 1.1rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .sub-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .sub-tab {
    background: white;
    border: 2px solid var(--light);
    color: var(--navy);
    padding: 9px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .sub-tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: white;
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: white;
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .obj-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }
  .obj-row:last-child { border-bottom: none; }
  .status-dot {
    width: 16px; height: 16px; border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.not-started { background: #ccc; }
  .status-dot.in-progress { background: var(--gold); }
  .status-dot.covered { background: var(--green); }
  .obj-main { flex: 1; }
  .obj-id { font-weight: 700; color: var(--navy); margin-right: 8px; }
  .obj-teks { font-size: 0.78rem; color: var(--gray); background: var(--light); padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
  .obj-status-label { font-size: 0.82rem; color: var(--gray); white-space: nowrap; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; font-size: 0.85rem; color: var(--gray); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  table.rubric { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.rubric th, table.rubric td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: top; }
  table.rubric th { background: var(--navy); color: white; }
  table.rubric td.basic-col { border-top: 3px solid var(--green); }
  table.rubric td.inter-col { border-top: 3px solid var(--navy); }
  table.rubric td.adv-col { border-top: 3px solid var(--maroon); }
  .rubric-note { font-size: 0.85rem; color: var(--gray); margin-bottom: 14px; font-style: italic; }
  .download-btn {
    display: inline-block;
    background: var(--navy);
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    margin-bottom: 18px;
    font-size: 0.9rem;
  }
  .cal-badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 10px;
    margin-right: 8px;
    color: white;
    white-space: nowrap;
  }
  .cal-lesson { background: var(--navy); }
  .cal-homework { background: var(--gray); }
  .cal-quiz { background: var(--gold); }
  .cal-review { background: #6b46c1; }
  .cal-test { background: var(--maroon); }
  .cal-final { background: #4a1c1c; }
  .day-heading {
    color: var(--navy);
    border-bottom: 2px solid var(--light);
    padding-bottom: 8px;
    margin-top: 28px;
  }
  .day-heading:first-of-type { margin-top: 4px; }
  .topic-block { margin-bottom: 20px; }
  .topic-label {
    display: inline-block;
    font-weight: 700;
    color: var(--navy-dark);
    background: var(--light);
    padding: 4px 14px;
    border-radius: 14px;
    margin-bottom: 12px;
    font-size: 0.85rem;
  }
  .miss-day { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
  .miss-day:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .miss-section { margin-top: 10px; font-size: 0.92rem; line-height: 1.5; }
  .miss-section strong { color: var(--navy); }
  .board-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .board-item img { width: 100%; border-radius: 8px; display: block; margin-bottom: 8px; }
  .board-item .cap { font-size: 0.82rem; color: var(--gray); }
  .empty-state { color: var(--gray); font-style: italic; padding: 20px 0; }
  .practice-select, .obj-picker {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  .qa-item { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #eee; }
  .qa-item:last-child { border: none; }
  .qa-prompt { font-weight: 600; margin-bottom: 6px; }
  .qa-answer {
    display: none;
    background: var(--light);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.9rem;
    color: var(--navy-dark);
    margin-top: 6px;
  }
  .qa-answer.shown { display: block; }
  .reveal-btn {
    background: none;
    border: 1px solid var(--navy);
    color: var(--navy);
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .bell-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid #eee; }
  .bell-item:last-child { border: none; }
  .bell-date { font-weight: 700; color: var(--navy); min-width: 100px; }
  .bell-item img { max-width: 220px; border-radius: 8px; margin-top: 6px; }
  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 4px;
  }
  .flash-card {
    background: var(--light);
    border-radius: 10px;
    padding: 14px;
  }
  .flash-term { font-weight: 700; color: var(--navy); margin-bottom: 8px; }
  .graph-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 4px;
  }
  .graph-card {
    background: white;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .graph-card img { width: 100%; max-width: 260px; border-radius: 6px; margin-bottom: 8px; }
  .graph-card .qa-prompt { font-size: 0.88rem; }
  .video-list { list-style: none; padding: 0; }
  .video-list li { margin-bottom: 8px; }
  .video-list a { color: var(--navy); font-weight: 600; }
  h2.section-title { color: var(--navy); margin-top: 0; }
</style>
</head>
<body>

<header>
  <h1>Mrs. Nield's Math Classes</h1>
  <div class="course-tabs" id="courseTabs"></div>
</header>

<main id="mainContent"></main>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
